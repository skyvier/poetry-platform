name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Unlock poems
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          echo "$GIT_CRYPT_KEY" | base64 -d > "$RUNNER_TEMP/git-crypt.key"
          nix shell nixpkgs#git-crypt -c git-crypt unlock "$RUNNER_TEMP/git-crypt.key"
          rm "$RUNNER_TEMP/git-crypt.key"
      # Builds the generator (running the Haskell tests) and then the site.
      - name: Build site
        env:
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
        run: nix run . -- build
      # Includes decrypting every built page with the browser code.
      - name: JavaScript tests
        env:
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
        run: node --test test/*.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
